# Distributed Multimodal Video Note-Taking Agent — local stack.
#   docker compose up -d --build                 # gateway, outbox publisher, 2 workers + infra
#   docker compose up -d --scale worker=3        # scale workers
#   docker compose --profile test run --rm tests # integration tests (isolated DB / vhost / Redis db)
# All values come from .env (never committed). Scalable services have no container_name.
name: notes-agent

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  image: notes-agent-backend:dev
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=80"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-512m}

  rabbitmq:
    # Pinned to the exact version whose semantics were verified by the integration tests
    # (delivery-count behaviour differs between RabbitMQ releases — see ADR-05).
    image: rabbitmq:4.4.1-management
    hostname: rabbitmq          # stable node name => durable data survives restarts
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./backend/infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-notes-agent.conf:ro
    ports:
      - "127.0.0.1:15672:15672"   # management UI (localhost only)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${RABBITMQ_MEM_LIMIT:-512m}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-96mb}",
              "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-128m}

  migrate:
    build:
      context: ./backend
      target: runtime
    image: notes-agent-backend:dev
    command: ["python", "-m", "notesagent.common.migrate"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *backend
    command: ["python", "-m", "notesagent.gateway"]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_URL: ${REDIS_URL}
      JOB_PAYLOAD_ENCRYPTION_KEY: ${JOB_PAYLOAD_ENCRYPTION_KEY}
      CREDENTIAL_TTL_HOURS: ${CREDENTIAL_TTL_HOURS:-24}
      IDEMPOTENCY_KEY_TTL_HOURS: ${IDEMPOTENCY_KEY_TTL_HOURS:-24}
      QUEUE_DELIVERY_LIMIT: ${QUEUE_DELIVERY_LIMIT:-10}
      BACKOFF_SCHEDULE_SEC: ${BACKOFF_SCHEDULE_SEC:-10,30,90}
      LOCK_RETRY_DELAY_SEC: ${LOCK_RETRY_DELAY_SEC:-5}
      INFRA_RETRY_DELAY_SEC: ${INFRA_RETRY_DELAY_SEC:-30}
      # Notion OAuth (ADR-18): code exchange happens ONLY here; the client secret never reaches the
      # extension or the workers. Values come from .env and are never logged.
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      NOTION_REDIRECT_URI: ${NOTION_REDIRECT_URI:-}
      NOTION_VERSION: ${NOTION_VERSION:-2026-03-11}
      NOTION_RPS_LIMIT: ${NOTION_RPS_LIMIT:-2.5}
      OAUTH_STATE_TTL_SEC: ${OAUTH_STATE_TTL_SEC:-600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_MEM_LIMIT:-256m}

  outbox-publisher:
    <<: *backend
    command: ["python", "-m", "notesagent.outbox"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      QUEUE_DELIVERY_LIMIT: ${QUEUE_DELIVERY_LIMIT:-10}
      BACKOFF_SCHEDULE_SEC: ${BACKOFF_SCHEDULE_SEC:-10,30,90}
      LOCK_RETRY_DELAY_SEC: ${LOCK_RETRY_DELAY_SEC:-5}
      INFRA_RETRY_DELAY_SEC: ${INFRA_RETRY_DELAY_SEC:-30}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/outbox-heartbeat') < 60 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${OUTBOX_MEM_LIMIT:-192m}

  worker:
    <<: *backend
    command: ["python", "-m", "notesagent.worker"]
    stop_grace_period: 15s
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_URL: ${REDIS_URL}
      JOB_PAYLOAD_ENCRYPTION_KEY: ${JOB_PAYLOAD_ENCRYPTION_KEY}
      CREDENTIAL_READ_WAIT_SEC: ${CREDENTIAL_READ_WAIT_SEC:-90}
      QUEUE_DELIVERY_LIMIT: ${QUEUE_DELIVERY_LIMIT:-10}
      BACKOFF_SCHEDULE_SEC: ${BACKOFF_SCHEDULE_SEC:-10,30,90}
      LOCK_RETRY_DELAY_SEC: ${LOCK_RETRY_DELAY_SEC:-5}
      INFRA_RETRY_DELAY_SEC: ${INFRA_RETRY_DELAY_SEC:-30}
      RABBITMQ_MANAGEMENT_URL: ${RABBITMQ_MANAGEMENT_URL:-http://rabbitmq:15672}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
      INFRA_MAX_ATTEMPTS: ${INFRA_MAX_ATTEMPTS:-20}
      # Shared rate limiter (ADR-13); ":-" also applies the default when .env has an empty value.
      GEMINI_RPM_LIMIT: ${GEMINI_RPM_LIMIT:-4}
      GEMINI_TPM_LIMIT: ${GEMINI_TPM_LIMIT:-200000}
      GEMINI_RPD_LIMIT: ${GEMINI_RPD_LIMIT:-16}
      NOTION_RPS_LIMIT: ${NOTION_RPS_LIMIT:-2.5}
      RATE_LIMIT_MAX_WAIT_SEC: ${RATE_LIMIT_MAX_WAIT_SEC:-60}
      RATE_LIMIT_DEFAULT_COOLDOWN_SEC: ${RATE_LIMIT_DEFAULT_COOLDOWN_SEC:-10}
      # TRANSCRIBING stage (ADR-14): constraint A and transcript language preference.
      MAX_VIDEO_DURATION_SEC: ${MAX_VIDEO_DURATION_SEC:-1200}
      TRANSCRIPT_LANGUAGES: ${TRANSCRIPT_LANGUAGES:-en}
      # SUMMARIZING stage (ADR-06, ADR-15). The key is a secret: never printed or logged.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      TRANSCRIPT_CHUNK_TOKENS: ${TRANSCRIPT_CHUNK_TOKENS:-12000}
      MAX_FRAMES: ${MAX_FRAMES:-8}
      # EXTRACTING_FRAMES stage (ADR-16).
      FRAME_SOURCE_MAX_HEIGHT: ${FRAME_SOURCE_MAX_HEIGHT:-720}
      FRAME_MAX_WIDTH: ${FRAME_MAX_WIDTH:-1280}
      # PUBLISHING stage (ADR-17). The OAuth token is NOT configured here: it travels per job in the
      # encrypted credential mailbox (ADR-03).
      NOTION_VERSION: ${NOTION_VERSION:-2026-03-11}
      NOTION_DEFAULT_PARENT_ID: ${NOTION_DEFAULT_PARENT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker-heartbeat') < 30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-768m}

  # Integration tests: same code, test-only dependencies, isolated database (notes_test),
  # RabbitMQ vhost (notes_test) and Redis db 15. Uses its own throwaway encryption key.
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    image: notes-agent-backend:test
    volumes:
      # Failure diagnostics written by tests (tests/support/diagnostics.py) survive the --rm container.
      - ./backend/test-artifacts:/app/test-artifacts
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notes_test
      TEST_ADMIN_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/notes_test
      TEST_RABBITMQ_MGMT_URL: http://rabbitmq:15672
      TEST_RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      TEST_RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS}
      TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m

volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
