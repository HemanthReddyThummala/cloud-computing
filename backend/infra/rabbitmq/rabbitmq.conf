# Loaded from /etc/rabbitmq/conf.d/ — sized for a 16 GB laptop (container limit ~512 MB).
# Block publishers when RabbitMQ uses 60% of the memory available to its container.
vm_memory_high_watermark.relative = 0.6
# Stop accepting messages when free disk drops below 500 MB.
disk_free_limit.absolute = 500MB
# A delivered-but-unacknowledged message is returned to the queue after 1 hour
# (jobs ≤ 20 min of video finish well within this).
consumer_timeout = 3600000
