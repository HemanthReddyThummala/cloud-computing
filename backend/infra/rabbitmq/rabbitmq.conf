# Loaded from /etc/rabbitmq/conf.d/ — sized for a 16 GB laptop (container limit ~512 MB).
# RabbitMQ measures memory against the whole Docker VM (~7.8 GB), not the container's cgroup
# limit, so without this override the watermark lands far above the 512 MiB container limit and
# the kernel OOM-kills the broker before back-pressure starts. Tell it the real budget: 512 MiB.
total_memory_available_override_value = 536870912
# Block publishers when RabbitMQ uses 60% of that budget (~307 MiB).
vm_memory_high_watermark.relative = 0.6
# Stop accepting messages when free disk drops below 500 MB.
disk_free_limit.absolute = 500MB
# A delivered-but-unacknowledged message is returned to the queue after 1 hour
# (jobs ≤ 20 min of video finish well within this).
consumer_timeout = 3600000
